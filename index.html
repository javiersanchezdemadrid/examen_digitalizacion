    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; touch-action: manipulation; }
        .quiz-container { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 800px; width: 95%; position: relative; box-sizing: border-box; }
        .header-row { display: flex; justify-content: space-between; align-items: start; border-bottom: 2px solid #007bff; padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
        h1 { color: #333; font-size: 1.4rem; margin: 0; }
        .shuffle-btn { background-color: #6c757d; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
        .shuffle-btn:hover { background-color: #5a6268; }
        .score-board { font-size: 0.9rem; color: #555; margin-top: 5px; }
        .question { font-size: 1.2rem; margin-bottom: 1.2rem; font-weight: 600; color: #2c3e50; line-height: 1.4; }
        .question-img-container { text-align: center; margin-top: 15px; margin-bottom: 15px; }
        .question-img { max-width: 100%; max-height: 350px; border-radius: 8px; object-fit: contain; }
        
        /* Opciones Clásicas */
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 8px; background: white; cursor: pointer; text-align: left; transition: all 0.2s; font-size: 1rem; position: relative; }
        .option-btn:hover:not(:disabled) { background-color: #f0f8ff; border-color: #007bff; }
        .option-btn.correct { background-color: #d4edda; border-color: #28a745; color: #155724; }
        .option-btn.wrong { background-color: #f8d7da; border-color: #dc3545; color: #721c24; }
        .option-btn.should-have-been { border: 2px dashed #28a745; background-color: #e9f7ef; }
        .option-btn:disabled { cursor: default; opacity: 1; } 
        
        .option-content { display: flex; align-items: center; gap: 15px; }
        .option-img { max-width: 150px; max-height: 150px; border-radius: 5px; object-fit: contain; }
        .option-text { flex-grow: 1; }

        /* Arrastrar y Soltar (DND) Estilos */
        .dnd-board { display: flex; flex-direction: column; align-items: center; width: 100%; user-select: none; }
        .dnd-img-wrapper { position: relative; display: inline-block; max-width: 100%; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; }
        .dnd-img-wrapper img { display: block; max-width: 100%; height: auto; pointer-events: none; }
        .dnd-zone { position: absolute; background: rgba(255, 255, 255, 0.7); border: 2px dashed #333; border-radius: 5px; transform: translate(-50%, -50%); min-width: 100px; min-height: 35px; display: flex; justify-content: center; align-items: center; }
        .dnd-zone.filled { border: 2px solid #28a745; background: rgba(212, 237, 218, 0.9); }
        .dnd-bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; width: 100%; padding: 15px; background: #e9ecef; border-radius: 8px; min-height: 60px; box-sizing: border-box;}
        .dnd-label { padding: 8px 12px; background: #007bff; color: white; border-radius: 5px; cursor: grab; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2); touch-action: none; text-align: center; }
        .dnd-label:active { cursor: grabbing; }
        .dnd-label.placed { cursor: default; background: #28a745; box-shadow: none; width: 100%; height: 100%; border-radius: 3px; display:flex; align-items:center; justify-content:center; margin:0;}

        /* Feedback y Controles */
        .feedback { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; font-size: 1rem; line-height: 1.5; }
        .feedback.show { display: block; animation: fadeIn 0.3s; }
        .feedback-correct { background-color: #e9f7ef; border-left: 5px solid #28a745; }
        .feedback-wrong { background-color: #fce8e6; border-left: 5px solid #dc3545; }
        .feedback-info { background-color: #e2e6ea; border-left: 5px solid #6c757d; }
        .controls { margin-top: 30px; display: flex; justify-content: space-between; gap: 10px; padding-top: 15px; border-top: 1px solid #eee; }
        .nav-btn { padding: 10px 25px; border-radius: 5px; cursor: pointer; font-size: 1rem; border: none; font-weight: bold; transition: 0.2s; }
        #prev-btn { background-color: #e2e6ea; color: #333; }
        #prev-btn:hover:not(:disabled) { background-color: #dbe0e5; }
        #prev-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #next-btn { background-color: #007bff; color: white; } 
        #next-btn:hover { background-color: #0056b3; }
        #next-btn.back-to-results { background-color: #6c757d; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

            </div>
        </div>
        <button class="shuffle-btn" onclick="restartQuizManual(false)">🔄 Reiniciar</button>
    </div>
    
    <div id="question-area">

        <div class="options" id="options-container"></div>
        <div id="dnd-container" style="display:none;"></div>
        
        <div class="feedback" id="feedback-text"></div>
    </div>

    <div class="controls">
        <button id="prev-btn" class="nav-btn" onclick="prevQuestion()">Anterior</button>
        <div style="flex-grow: 1;"></div> 
        <button id="next-btn" class="nav-btn" onclick="nextQuestion()">Siguiente</button>
    </div>
</div>

<div class="quiz-container" id="results-ui" style="display: none; text-align: center;">

    const config = {
    "shuffle": true
};

    let currentQuestionIndex = 0;
    let userAnswers = []; 
    let isReviewMode = false;

    const quizUI = document.getElementById('quiz-ui');
    const resultsUI = document.getElementById('results-ui');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const dndContainer = document.getElementById('dnd-container');
    const feedbackText = document.getElementById('feedback-text');
    const nextBtn = document.getElementById('next-btn');
    const prevBtn = document.getElementById('prev-btn');
    const currentQSpan = document.getElementById('current-q');
    const scoreValSpan = document.getElementById('score-val');

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function randomizeData() {
        if(!config.shuffle) return;
        shuffleArray(quizData.questions);
        quizData.questions.forEach(question => {
            if(question.type === 'choice' || !question.type) shuffleArray(question.answerOptions);
            if(question.type === 'dnd') shuffleArray(question.dndZones);
        });
    }

    function initQuiz() {
        userAnswers = new Array(quizData.questions.length).fill(null);
        document.getElementById('total-q').innerText = quizData.questions.length;
        isReviewMode = false;
        currentQuestionIndex = 0;
        updateScoreUI();
        quizUI.style.display = 'block';
        resultsUI.style.display = 'none';
        loadQuestion();
    }

    function restartQuizManual(isFinished = false) {
        if(!isFinished && !confirm("¿Reiniciar el quiz en curso? Perderás el progreso actual.")) return;
        randomizeData();
        initQuiz();
    }

    function updateScoreUI() {
        let currentScore = 0;
        userAnswers.forEach((ans, qIndex) => {
            if (ans !== null) {
                const q = quizData.questions[qIndex];
                if ((q.type === 'choice' || !q.type) && q.answerOptions && q.answerOptions[ans] && q.answerOptions[ans].isCorrect) {
                    currentScore++;
                } else if (q.type === 'dnd' && ans === true) {
                    currentScore++;
                }
            }
        });
        scoreValSpan.innerText = currentScore;
        return currentScore;
    }

    function loadQuestion() {
        const currentQ = quizData.questions[currentQuestionIndex];
        currentQSpan.innerText = currentQuestionIndex + 1;
        prevBtn.disabled = (currentQuestionIndex === 0);
        
        if (currentQuestionIndex === quizData.questions.length - 1) {
            nextBtn.innerText = isReviewMode ? 'Volver a Resultados' : 'Finalizar y Ver Nota';
            if(isReviewMode) nextBtn.classList.add('back-to-results');
            else nextBtn.classList.remove('back-to-results');
        } else {
            nextBtn.innerText = 'Siguiente';
            nextBtn.classList.remove('back-to-results');
        }

        questionText.innerHTML = '';
        if (currentQ.question) {
            const qTextDiv = document.createElement('div');
            qTextDiv.innerText = currentQ.question;
            questionText.appendChild(qTextDiv);
        }

        feedbackText.className = 'feedback';
        feedbackText.innerHTML = '';
        feedbackText.style.display = 'none';

        if (currentQ.type === 'choice' || !currentQ.type) {
            dndContainer.style.display = 'none';
            optionsContainer.style.display = 'flex';
            renderChoiceQuestion(currentQ);
        } else if (currentQ.type === 'dnd') {
            optionsContainer.style.display = 'none';
            dndContainer.style.display = 'block';
            renderDndQuestion(currentQ);
        }
    }

    function renderChoiceQuestion(currentQ) {
        if (currentQ.image) {
            const imgContainer = document.createElement('div');
            imgContainer.className = 'question-img-container';
            const img = document.createElement('img');
            img.src = currentQ.image;
            img.className = 'question-img';
            imgContainer.appendChild(img);
            questionText.appendChild(imgContainer);
        }

        optionsContainer.innerHTML = '';
        currentQ.answerOptions.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'option-content';
            
            if (opt.image) {
                const optImg = document.createElement('img');
                optImg.src = opt.image;
                optImg.className = 'option-img';
                contentDiv.appendChild(optImg);
            }
            if (opt.text) {
                const optSpan = document.createElement('span');
                optSpan.className = 'option-text';
                optSpan.innerText = opt.text;
                contentDiv.appendChild(optSpan);
            }
            btn.appendChild(contentDiv);

            const userIdx = userAnswers[currentQuestionIndex];
            
            if (isReviewMode || userIdx !== null) {
                btn.disabled = true;
                if (userIdx !== null && index === userIdx) {
                    if (opt.isCorrect) btn.classList.add('correct');
                    else btn.classList.add('wrong');
                } else if (opt.isCorrect && (userIdx === null || !currentQ.answerOptions[userIdx].isCorrect)) {
                    btn.classList.add('should-have-been');
                }
            } else {
                btn.onclick = () => checkChoiceAnswer(opt, index);
            }
            optionsContainer.appendChild(btn);
        });

        if (userAnswers[currentQuestionIndex] !== null) {
            showFeedbackText(currentQ.answerOptions[userAnswers[currentQuestionIndex]], currentQ, false);
        } else if (isReviewMode) {
            const correctOpt = currentQ.answerOptions.find(o => o.isCorrect);
            showMissedFeedback(correctOpt);
        }
    }

    function checkChoiceAnswer(selectedOption, index) {
        userAnswers[currentQuestionIndex] = index;
        updateScoreUI();
        const allBtns = optionsContainer.querySelectorAll('.option-btn');
        const currentQ = quizData.questions[currentQuestionIndex];

        allBtns.forEach((btn, i) => {
            btn.disabled = true;
            const opt = currentQ.answerOptions[i];
            if (i === index) {
                if (opt.isCorrect) btn.classList.add('correct');
                else btn.classList.add('wrong');
            } else if (opt.isCorrect && !selectedOption.isCorrect) {
                btn.classList.add('should-have-been');
            }
        });
        showFeedbackText(selectedOption, currentQ, true);
    }

    function renderDndQuestion(currentQ) {
        dndContainer.innerHTML = '';
        
        const board = document.createElement('div');
        board.className = 'dnd-board';

        const imgWrapper = document.createElement('div');
        imgWrapper.className = 'dnd-img-wrapper';
        
        const img = document.createElement('img');
        img.src = currentQ.image;
        imgWrapper.appendChild(img);

        const bank = document.createElement('div');
        bank.className = 'dnd-bank';

        const isCompleted = userAnswers[currentQuestionIndex] === true;
        
        currentQ.dndZones.forEach(zone => {
            const zDiv = document.createElement('div');
            zDiv.className = 'dnd-zone';
            zDiv.style.left = zone.x + '%';
            zDiv.style.top = zone.y + '%';
            zDiv.dataset.id = zone.id;
            zDiv.dataset.text = zone.text.trim().toLowerCase(); 
            
            if(isCompleted || isReviewMode) {
                zDiv.classList.add('filled');
                const pLabel = document.createElement('div');
                pLabel.className = 'dnd-label placed';
                pLabel.innerText = zone.text;
                zDiv.appendChild(pLabel);
            }
            imgWrapper.appendChild(zDiv);
        });

        if(!isCompleted && !isReviewMode) {
            let bankLabels = [...currentQ.dndZones];
            if(config.shuffle) shuffleArray(bankLabels);

            bankLabels.forEach(zone => {
                const lDiv = document.createElement('div');
                lDiv.className = 'dnd-label';
                lDiv.innerText = zone.text;
                lDiv.dataset.id = zone.id;
                lDiv.dataset.text = zone.text.trim().toLowerCase(); 
                
                lDiv.addEventListener('touchstart', handleDragStart, {passive: false});
                lDiv.addEventListener('mousedown', handleDragStart);
                
                bank.appendChild(lDiv);
            });
        }

        board.appendChild(imgWrapper);
        if(!isCompleted && !isReviewMode) board.appendChild(bank);
        dndContainer.appendChild(board);

        if (isCompleted) {
            showFeedbackText({isCorrect: true, rationale: "¡Has colocado todas las piezas correctamente!"}, currentQ, false);
        } else if (isReviewMode) {
            showMissedFeedback({text: "Todas las piezas puestas en su lugar correspondiente."});
        }
    }

    let dragClone = null;
    let dragOriginal = null;
    let shiftX = 0, shiftY = 0;

    function handleDragStart(e) {
        if(e.target.classList.contains('placed')) return;
        dragOriginal = e.target;
        const ev = e.type.includes('touch') ? e.touches[0] : e;
        const rect = dragOriginal.getBoundingClientRect();
        
        shiftX = ev.clientX - rect.left;
        shiftY = ev.clientY - rect.top;

        dragClone = dragOriginal.cloneNode(true);
        dragClone.style.position = 'fixed';
        dragClone.style.zIndex = 9999;
        dragClone.style.left = ev.clientX - shiftX + 'px';
        dragClone.style.top = ev.clientY - shiftY + 'px';
        dragClone.style.width = rect.width + 'px';
        dragClone.style.margin = '0';
        dragClone.style.pointerEvents = 'none';
        document.body.appendChild(dragClone);

        dragOriginal.style.opacity = '0.3';

        document.addEventListener('touchmove', handleDragMove, {passive: false});
        document.addEventListener('mousemove', handleDragMove, {passive: false});
        document.addEventListener('touchend', handleDragEnd);
        document.addEventListener('mouseup', handleDragEnd);

        if(e.type === 'touchstart') e.preventDefault(); 
    }

    function handleDragMove(e) {
        if(!dragClone) return;
        e.preventDefault(); 
        const ev = e.type.includes('touch') ? e.touches[0] : e;
        dragClone.style.left = ev.clientX - shiftX + 'px';
        dragClone.style.top = ev.clientY - shiftY + 'px';
    }

    function handleDragEnd(e) {
        if(!dragClone) return;
        const ev = e.type.includes('touch') ? e.changedTouches[0] : e;
        
        dragClone.remove();
        dragClone = null;
        dragOriginal.style.opacity = '1';

        document.removeEventListener('touchmove', handleDragMove);
        document.removeEventListener('mousemove', handleDragMove);
        document.removeEventListener('touchend', handleDragEnd);
        document.removeEventListener('mouseup', handleDragEnd);

        const target = document.elementFromPoint(ev.clientX, ev.clientY);
        const zone = target ? target.closest('.dnd-zone') : null;

        if (zone && !zone.classList.contains('filled')) {
            if (zone.dataset.text === dragOriginal.dataset.text) {
                zone.appendChild(dragOriginal);
                zone.classList.add('filled');
                dragOriginal.classList.add('placed');
                dragOriginal.removeEventListener('touchstart', handleDragStart);
                dragOriginal.removeEventListener('mousedown', handleDragStart);
                
                checkDndCompletion();
            } else {
                feedbackText.style.display = 'block';
                feedbackText.className = 'feedback show feedback-wrong';
                feedbackText.innerHTML = `<strong>¡Te has equivocado!</strong><br>Ese no es el lugar de "${dragOriginal.innerText}". Vuelve a intentarlo.`;
                setTimeout(() => { if(userAnswers[currentQuestionIndex] !== true) feedbackText.style.display = 'none'; }, 2500);
            }
        }
        dragOriginal = null;
    }

    function checkDndCompletion() {
        const totalZones = quizData.questions[currentQuestionIndex].dndZones.length;
        const filledZones = dndContainer.querySelectorAll('.dnd-zone.filled').length;
        if(filledZones === totalZones) {
            userAnswers[currentQuestionIndex] = true;
            updateScoreUI();
            showFeedbackText({isCorrect: true, rationale: "¡Puzzle completado correctamente!"}, quizData.questions[currentQuestionIndex], true);
        }
    }

    function showFeedbackText(selectedOpt, currentQ, isNewAnswer) {
        feedbackText.style.display = 'block';
        feedbackText.classList.add('show');
        if (selectedOpt.isCorrect !== false) { 
            feedbackText.classList.add('feedback-correct');
            feedbackText.innerHTML = `<strong>¡Correcto!</strong><br>${selectedOpt.rationale || ""}`;
            
            if (currentQ.showConfetti && isNewAnswer) {
                confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, zIndex: 9999 });
            }
        } else {
            const correctOpt = currentQ.answerOptions.find(o => o.isCorrect);
            const correctLabel = correctOpt.text ? correctOpt.text : '(La opción ilustrada correcta)';
            feedbackText.classList.add('feedback-wrong');
            feedbackText.innerHTML = `<strong>Incorrecto.</strong><br>${selectedOpt.rationale || ""}<br><br><strong>Respuesta correcta:</strong> ${correctLabel}`;
        }
    }

    function showMissedFeedback(correctOpt) {
        feedbackText.style.display = 'block';
        feedbackText.classList.add('show', 'feedback-info');
        feedbackText.innerHTML = `<strong>No contestada.</strong><br>La respuesta era: ${correctOpt.text ? correctOpt.text : '(Mira el código de colores)'}`;
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) { currentQuestionIndex--; loadQuestion(); }
    }

    function nextQuestion() {
        if (currentQuestionIndex < quizData.questions.length - 1) {
            currentQuestionIndex++; loadQuestion();
        } else {
            if (isReviewMode) showResultsScreen(); 
            else finishQuiz(); 
        }
    }

    function finishQuiz() {
        const finalScore = updateScoreUI();
        const total = quizData.questions.length;
        const percentage = (finalScore / total) * 100;
        let msg = percentage === 100 ? '¡Perfecto!' : percentage >= 50 ? 'Has aprobado.' : 'Sigue practicando.';

        const unanswered = userAnswers.filter(u => u === null).length;
        if(unanswered > 0) msg += `<br><small>(Dejaste ${unanswered} preguntas sin contestar)</small>`;

        document.getElementById('final-score-display').innerHTML = `Has acertado <strong>${finalScore}</strong> de <strong>${total}</strong>`;
        document.getElementById('final-msg-display').innerHTML = msg;
        showResultsScreen();
    }

    function showResultsScreen() {
        quizUI.style.display = 'none';
        resultsUI.style.display = 'block';
    }

    function enterReviewMode() {
        isReviewMode = true;
        currentQuestionIndex = 0;
        resultsUI.style.display = 'none';
        quizUI.style.display = 'block';
        loadQuestion();
    }

    randomizeData();
    initQuiz();
</script>
